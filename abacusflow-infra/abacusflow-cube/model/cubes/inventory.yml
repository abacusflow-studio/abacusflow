cubes:
  - name: inventory
    sql_table: public.inventory
    data_source: default

    joins:
      - name: product
        sql: "{CUBE}.product_id = {product.id}"
        relationship: many_to_one

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: tenant_id
        sql: tenant_id
        type: number

      - name: safety_stock
        sql: safety_stock
        type: number

      - name: max_stock
        sql: max_stock
        type: number

      - name: created_at
        sql: created_at
        type: time

      - name: updated_at
        sql: updated_at
        type: time

    measures:
      - name: count
        type: count

      - name: low_stock_count
        type: count
        description: 当前库存量低于安全库存的品目数
        filters:
          - sql: >
              {CUBE}.safety_stock > COALESCE(
                (SELECT SUM(iu.quantity) FROM public.inventory_unit iu WHERE iu.inventory_id = {CUBE}.id),
                0
              )

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
