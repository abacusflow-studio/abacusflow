openapi: 3.0.0
info:
  title: abacusflow api
  version: 0.0.1
  description: 小算盘服务接口文档
servers:
  - url: http://localhost:8080
tags:
  - name: inventory
    description: 管理产品库存状态和库存操作，包括库存数量、多储存点支持、库存调整与预警机制。
  - name: partner
    description: 管理客户和供应商等外部合作伙伴的信息，并与交易历史进行关联管理。
  - name: product
    description: 管理产品的基础信息，包括分类、规格及产品本身的增删改查操作。
  - name: transaction
    description: 处理采购和销售订单的全流程，涵盖订单创建、状态跟踪及订单明细处理。
  - name: user
    description: 管理系统用户账户、权限控制及用户行为相关的信息。
  - name: depot
    description: 管理物理储存点及其内部存储空间，包括库位分配、容量规划和储存点布局设计。
  - name: feedback
    description: 收集和管理用户反馈，支持问题提交、状态流转、负责人分配和内部备注。
  - name: tenant
    description: 管理租户的创建和查询，支持多租户环境下的租户选择与切换。
  - name: permission
    description: 管理系统权限定义（平台级）
  - name: role
    description: 管理租户级角色和权限分配
  - name: file
    description: 文件上传管理


x-error-responses:
  '400':
    description: 参数错误
    schema:
      $ref: "#/components/schemas/ErrorResponse"
  '401':
    description: 未认证
    schema:
      $ref: "#/components/schemas/ErrorResponse"
  '403':
    description: 无权限
    schema:
      $ref: "#/components/schemas/ErrorResponse"
  '500':
    description: 服务内部错误
    schema:
      $ref: "#/components/schemas/ErrorResponse"

security:
  - bearerAuth: []

paths:
  /me/bootstrap:
    post:
      operationId: bootstrap
      tags:
        - user
      summary: Bootstrap current user
      description: |
        同步当前用户资料。后端使用 Access Token 调用 Auth0 /userinfo 获取 email/name/picture，
        更新本地 User 和 ExternalIdentity 的 profile 信息。
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResult"

  /tenants:
    post:
      operationId: createTenant
      tags:
        - tenant
      summary: Create a new tenant
      description: |
        创建一个新租户。当前用户将自动成为该租户的管理员。
        任何已认证用户都可以创建自己的租户（自服务操作，不需要特殊权限）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSummary"
        "400":
          description: 参数错误
        "403":
          description: 无权限

    get:
      operationId: listTenants
      tags:
        - tenant
      summary: List user's tenants
      description: 返回当前用户所属的所有租户列表，需要 platform:tenant:list 权限
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantSummary"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags:
        - tenant
      summary: Get tenant detail
      description: 返回指定租户的详细信息，仅限该租户的成员可查看，需要 tenant:info:read 权限
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetail"
        "403":
          description: 无权限
        "404":
          description: 租户不存在

    put:
      operationId: updateTenant
      tags:
        - tenant
      summary: Update tenant
      description: 更新租户的显示名称，需要是该租户的成员
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantInput"
      responses:
        "200":
          description: Tenant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantDetail"
        "403":
          description: 无权限
        "404":
          description: 租户不存在

  /tenants/members:
    get:
      operationId: listTenantMembers
      tags:
        - tenant
      summary: List tenant members
      description: 返回当前租户（基于 X-Tenant-Id）的所有成员列表，需要 tenant:member:read 权限
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantMember"
        "403":
          description: 无权限
    post:
      operationId: addTenantMember
      tags:
        - tenant
      summary: Add a member to the current tenant
      description: 将已有用户添加为当前租户的成员，并可指定初始角色，需要 tenant:member:create 权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTenantMemberInput"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"
        "400":
          description: 参数错误
        "403":
          description: 无权限

  /tenants/members/{membershipId}:
    delete:
      operationId: removeTenantMember
      tags:
        - tenant
      summary: Remove a member from the current tenant
      description: 从当前租户中移除成员（不删除用户账号），需要 tenant:member:remove 权限
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Member removed
        "403":
          description: 无权限
        "404":
          description: 成员不存在

  /tenants/members/{membershipId}/roles:
    put:
      operationId: updateMemberRoles
      tags:
        - tenant
      summary: Update member roles
      description: 更新成员的角色列表，需要 tenant:member:update 权限
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRolesInput"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantMember"
        "403":
          description: 无权限
        "404":
          description: 成员不存在

  /tenants/invitations:
    get:
      operationId: listTenantInvitations
      tags:
        - tenant
      summary: List tenant invitations
      description: 返回当前租户的所有邀请列表，需要 tenant:member:read 权限
      responses:
        "200":
          description: Invitation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantInvitation"
        "403":
          description: 无权限
    post:
      operationId: createTenantInvitation
      tags:
        - tenant
      summary: Invite a user to the current tenant
      description: 通过邮箱邀请新成员加入当前租户，需要 tenant:member:create 权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantInvitationInput"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitation"
        "400":
          description: 参数错误
        "403":
          description: 无权限

  /tenants/invitations/{invitationId}:
    delete:
      operationId: cancelTenantInvitation
      tags:
        - tenant
      summary: Cancel a tenant invitation
      description: 取消待接受的邀请，需要 tenant:member:create 权限
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Invitation cancelled
        "403":
          description: 无权限
        "404":
          description: 邀请不存在

  /tenants/invitations/accept:
    post:
      operationId: acceptTenantInvitation
      tags:
        - tenant
      summary: Accept a tenant invitation
      description: 通过邀请 token 接受邀请，任何已认证用户均可调用
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTenantInvitationInput"
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantInvitation"
        "400":
          description: 邀请已过期或已被接受
        "404":
          description: 邀请不存在

  /roles:
    get:
      operationId: listRoles
      tags:
        - role
      summary: List roles
      description: 返回当前租户的所有角色列表
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
        "403":
          description: 无权限

    post:
      operationId: createRole
      tags:
        - role
      summary: Create a role
      description: 创建新角色，需要 tenant:role:manage 权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: 参数错误
        "403":
          description: 无权限

  /roles/{roleId}:
    get:
      operationId: getRole
      tags:
        - role
      summary: Get role detail
      description: 返回角色详情
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Role detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          description: 无权限
        "404":
          description: 角色不存在

    put:
      operationId: updateRole
      tags:
        - role
      summary: Update role
      description: 更新角色的显示名称和权限，需要 tenant:role:manage 权限
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleInput"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "403":
          description: 无权限
        "404":
          description: 角色不存在

    delete:
      operationId: deleteRole
      tags:
        - role
      summary: Delete a role
      description: 删除角色（有成员使用时不可删除），需要 tenant:role:manage 权限
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Role deleted
        "403":
          description: 无权限
        "404":
          description: 角色不存在

  /permissions:
    get:
      operationId: listPermissions
      tags:
        - permission
      summary: List all permissions
      description: 返回系统所有可用权限列表（全局共享），需要 platform:permission:read 权限
      responses:
        "200":
          description: Permission list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    post:
      operationId: createPermission
      tags:
        - permission
      summary: Create a permission
      description: 创建新权限，需要 platform:permission:manage 权限
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePermissionInput"
      responses:
        "201":
          description: Permission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "400":
          description: 参数错误
        "403":
          description: 无权限

  /permissions/{permissionId}:
    put:
      operationId: updatePermission
      tags:
        - permission
      summary: Update a permission
      description: 更新权限的显示名称和描述，需要 platform:permission:manage 权限
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePermissionInput"
      responses:
        "200":
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Permission"
        "403":
          description: 无权限
        "404":
          description: 权限不存在
    delete:
      operationId: deletePermission
      tags:
        - permission
      summary: Delete a permission
      description: 删除权限（有角色使用时不可删除），需要 platform:permission:manage 权限
      parameters:
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Permission deleted
        "403":
          description: 无权限
        "404":
          description: 权限不存在

  /me:
    get:
      operationId: getCurrentUser
      tags:
        - user
      summary: Get current user info
      description: 返回当前登录用户的本地身份、角色、权限信息
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /users:
    get:
      operationId: listBasicUsers
      tags:
        - user
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BasicUser"
    post:
      operationId: addUser
      tags:
        - user
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags:
        - user
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      tags:
        - user
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags:
        - user
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: User deleted

  /suppliers:
    get:
      operationId: listBasicSuppliersPage
      tags:
        - partner
      summary: List suppliers page
      parameters:
        - name: pageIndex
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: contactPerson
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: address
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of suppliers page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageTemplate"
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: "#/components/schemas/BasicSupplier"
    post:
      operationId: addSupplier
      tags:
        - partner
      summary: Create a new supplier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupplierInput"
      responses:
        "200":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags:
        - partner
      summary: Get supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Supplier details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    put:
      operationId: updateSupplier
      tags:
        - partner
      summary: Update supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSupplierInput"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
    delete:
      operationId: deleteSupplier
      tags:
        - partner
      summary: Delete supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Supplier deleted

  /suppliers/selectable:
    get:
      operationId: listSelectableSuppliers
      tags:
        - partner
      summary: List suppliers for selection
      responses:
        "200":
          description: List of suppliers for selection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectableSupplier"

  /customers:
    get:
      operationId: listBasicCustomersPage
      tags:
        - partner
      summary: List customers page
      parameters:
        - name: pageIndex
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: phone
          in: query
          required: false
          schema:
            type: string
        - name: address
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of customers page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageTemplate"
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: "#/components/schemas/BasicCustomer"
    post:
      operationId: addCustomer
      tags:
        - partner
      summary: Create a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerInput"
      responses:
        "200":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /customers/{id}:
    get:
      operationId: getCustomer
      tags:
        - partner
      summary: Get customer by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Customer details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    put:
      operationId: updateCustomer
      tags:
        - partner
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerInput"
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    delete:
      operationId: deleteCustomer
      tags:
        - partner
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Customer deleted

  /customers/selectable:
    get:
      operationId: listSelectableCustomers
      tags:
        - partner
      summary: List customers for selection (e.g. dropdown)
      responses:
        "200":
          description: List of customers for selection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectableCustomer"

  /products:
    get:
      operationId: listBasicProductsPage
      tags:
        - product
      summary: List products page
      parameters:
        - name: pageIndex
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 10
            maximum: 100
        - name: name
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductType"
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
        - name: categoryId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: List of products page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageTemplate"
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: "#/components/schemas/BasicProduct"
    post:
      operationId: addProduct
      tags:
        - product
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "200":
          description: Product created
          content:
