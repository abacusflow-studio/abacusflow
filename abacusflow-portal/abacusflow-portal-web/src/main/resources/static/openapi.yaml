components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # ============= Me schemas =============
    BootstrapResult:
      type: object
      required:
        - userId
        - status
        - enabled
        - locked
        - roles
        - permissions
        - tenantStatus
        - tenants
      properties:
        userId:
          type: integer
          format: int64
          description: 本地用户 ID
        status:
          type: string
          enum:
            - ACTIVE
            - LOCKED
          description: 用户状态
        enabled:
          type: boolean
          description: 是否启用
        locked:
          type: boolean
          description: 是否锁定
        roles:
          type: array
          items:
            type: string
          description: 角色列表
        permissions:
          type: array
          items:
            type: string
          description: 所有权限列表（含平台和租户权限）
        platformPermissions:
          type: array
          items:
            type: string
          description: 平台级权限列表（platform:* 前缀）
        tenantPermissions:
          type: array
          items:
            type: string
          description: 租户级权限列表（tenant:* 前缀）
        email:
          type: string
          nullable: true
          description: 邮箱
        displayName:
          type: string
          nullable: true
          description: 显示名称
        pictureUrl:
          type: string
          nullable: true
          description: 头像 URL
        tenantStatus:
          type: string
          enum:
            - NEEDS_ONBOARDING
            - SINGLE_TENANT
            - MULTI_TENANT
          description: 租户选择状态
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantSummary"
          description: 用户所属租户列表
        currentTenantId:
          type: integer
          format: int64
          nullable: true
          description: 当前选中的租户 ID

    CreateTenantInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: 租户名称
          maxLength: 50
        displayName:
          type: string
          nullable: true
          description: 租户显示名称

    TenantSummary:
      type: object
      required:
        - tenantId
        - name
        - roleNames
        - permissionNames
      properties:
        tenantId:
          type: integer
          format: int64
          description: 租户 ID
        name:
          type: string
          description: 租户名称
        displayName:
          type: string
          nullable: true
          description: 租户显示名称
        roleNames:
          type: array
          items:
            type: string
          description: 该租户下的角色列表
        permissionNames:
          type: array
          items:
            type: string
          description: 该租户下的权限列表

